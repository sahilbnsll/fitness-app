[[redirects]]
  from = "/"
  to = "/fitness_hub.html"
  status = 200

# ── Security + caching headers ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Transport
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Framing / clickjacking
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    # MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Opt into cross-origin isolation friendliness
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Service worker must not be aggressively cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest small, safe to revalidate
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"
